  <circle cx="130" cy="280" r="25" fill="#003B2D" opacity="0.05"/>
  <!-- African pattern -->
  <path d="M200 350 l8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8 8-8 8 8" stroke="#0D883C" stroke-width="1.5" fill="none" opacity="0.12"/>
