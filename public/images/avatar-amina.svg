  <ellipse cx="50" cy="50" rx="3" ry="2.5" fill="#1A1A1A"/>
  <ellipse cx="70" cy="50" rx="3" ry="2.5" fill="#1A1A1A"/>
  <circle cx="51" cy="49.5" r="0.8" fill="white"/>
  <circle cx="71" cy="49.5" r="0.8" fill="white"/>
