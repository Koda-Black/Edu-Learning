  <path d="M46 45c2-2 5-2 7 0" stroke="#1A1A1A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <path d="M67 45c2-2 5-2 7 0" stroke="#1A1A1A" stroke-width="1.2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
